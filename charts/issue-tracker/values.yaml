image:
  repository: ghcr.io/ricsam/issue-tracker
  # No image is assumed to exist. Supply a tag that you have built or published.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Public origin used for same-origin checks and OIDC callback URLs.
baseUrl: ""

# Name of a pre-created Secret. It must contain existingSecretKey and the value
# must be base64 text that decodes to exactly 32 bytes.
existingSecret: ""
existingSecretKey: SETTINGS_ENCRYPTION_KEY

service:
  type: ClusterIP
  port: 3000

persistence:
  existingClaim: ""
  size: 1Gi
  accessMode: ReadWriteOnce
  # Empty uses the cluster's default StorageClass.
  storageClass: ""
  annotations: {}

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000

probes:
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 3
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 6

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  # Example:
  # hosts:
  #   - host: issues.example.com
  #     paths:
  #       - path: /
  #         pathType: Prefix
  tls: []
  # Example:
  # tls:
  #   - secretName: issues-example-tls
  #     hosts:
  #       - issues.example.com

nodeSelector: {}
tolerations: []
affinity: {}
