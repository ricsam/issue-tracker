apiVersion: v1
kind: Service
metadata:
  name: {{ include "issue-tracker.fullname" . }}
  labels:
    {{- include "issue-tracker.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "issue-tracker.selectorLabels" . | nindent 4 }}
