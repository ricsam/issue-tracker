# Operator values for the personal demo. Install chart version 0.29.0 explicitly.
# On a fresh database, override ingress.enabled=false until admin setup succeeds.
image:
  repository: ghcr.io/ricsam/issue-tracker
  # Supply the verified published SHA tag/digest documented in README.md.
  tag: ""
imagePullSecrets:
  - name: ghcr-registry
baseUrl: https://issue-tracker.r5d.app
migration:
  workspaceName: "richie's workspace"
  workspaceSlug: richies-workspace
existingSecret: issue-tracker-settings
persistence:
  storageClass: rook-ceph-block
  size: 2Gi
nodeSelector:
  kubernetes.io/hostname: hetzner-kata-2
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi
ingress:
  enabled: true
  className: traefik
  hosts:
    - host: issue-tracker.r5d.app
      paths:
        - path: /
          pathType: Prefix
